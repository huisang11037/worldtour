<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미스터 월드 테마투어</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Outfit:wght@500;600;700&display=swap">
<style>
/* Layout: 밝은 스카이 블루 테마 (홈 시안 A). 흰 바탕 + 둥근 카드 + 파란 포인트; 예약 = 번호 단계 + 따라오는 금액 요약. */
/* 색상·글꼴 변수 (라이트 모드) */
:root {
  --bg: #ffffff;
  --surface: #f3f6fa;
  --sky: #eef5ff;
  --fg: #0f172a;
  --body: #334155;
  --muted: #5b6b80;
  --line: #e6ecf3;
  --strong: #d5dee9;
  --accent: #1d63c9;
  --accent-ink: #1d4f91;
  --accent-weak: #e3eefd;
  --on-accent: #ffffff;
  --ok: #17794a;
  --ok-weak: #e8f5ec;
  --warn: #8a4b0b;
  --warn-weak: #fdf1de;
  --danger: #b42318;
  --scrim: rgba(15, 23, 42, 0.45);
  --shadow: rgba(15, 23, 42, 0.12);
  --font-sans: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "Outfit", "Noto Sans KR", system-ui, sans-serif;
  --r: 12px;
  --r-lg: 20px;
}
/* 밝은 테마 전용: 기기가 다크 모드여도 밝은 화면으로 보여 준다 */
:root { color-scheme: light; }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-sans); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent); }
h1, h2, h3 { margin: 0; line-height: 1.3; font-weight: 700; text-wrap: balance; }
h1 { font-size: clamp(22px, 3vw, 28px); }
h2 { font-size: 20px; }
h3 { font-size: 17px; }
.h-sm { font-size: 16px; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap {
  max-width: calc(1080px + 32px);
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Header */
.site-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--strong); }
.site-head .wrap { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; min-height: 56px; flex-wrap: wrap; padding-block: 8px; }
.logo { display: flex; align-items: center; gap: 10px; color: var(--fg); text-decoration: none; }
.logo b { font-family: var(--font-mono); font-weight: 500; font-size: 16px; letter-spacing: 0.06em; }
.proto { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px dashed var(--muted); color: var(--muted); padding: 1px 6px; }
.nav { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; font-size: 14px; }
.nav a:not(.btn) { color: var(--fg); text-decoration: none; }
.nav a.is-active { text-decoration: underline; text-underline-offset: 6px; }
.who { color: var(--muted); font-size: 13px; }
@media (max-width: 520px) { .who { display: none; } }

/* Shared */
#app { padding-block: 28px 64px; }
.view { display: flex; flex-direction: column; gap: 44px; }
.view-tight { gap: 20px; }
.label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.ok-t { color: var(--ok); }
.warn-t { color: var(--warn); }
.box { border: 1px solid var(--line); background: var(--bg); padding: 20px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
code { font-family: var(--font-mono); font-size: 0.92em; padding: 0 5px; border: 1px solid var(--line); background: var(--surface); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font: inherit; font-size: 14px; font-weight: 500; line-height: 1.3;
  padding: 8px 14px; border: 1px solid var(--strong); border-radius: var(--r);
  background: var(--bg); color: var(--fg); cursor: pointer; text-decoration: none;
}
.btn:hover { background: var(--surface); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn-danger { color: var(--danger); border-color: var(--danger); }
.btn-sm { padding: 4px 10px; font-size: 13px; }
.btn-block { width: 100%; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; filter: none; }

.badge { display: inline-block; font-size: 12px; font-weight: 500; line-height: 1.5; padding: 0 8px; border: 1px solid currentColor; border-radius: 999px; white-space: nowrap; }
.st-ok { color: var(--ok); background: var(--ok-weak); }
.st-wait { color: var(--warn); background: var(--warn-weak); }
.st-done { color: var(--muted); }
.st-ongoing { color: var(--accent); background: var(--accent-weak); }
.st-cancel { color: var(--danger); }
.badge-accent { color: var(--accent); background: var(--accent-weak); }

.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--strong); padding-bottom: 8px; margin-bottom: 16px; }
.note { font-size: 13px; color: var(--muted); margin-top: 12px; max-width: 78ch; }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 620px; }
.tbl th { font-weight: 500; font-size: 12px; color: var(--muted); text-align: left; background: var(--surface); white-space: nowrap; }
.tbl th, .tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl .r { text-align: right; }
.tbl .sub { display: block; font-size: 12px; color: var(--muted); }
.tbl .empty { text-align: center; color: var(--muted); padding: 28px 12px; }

/* Home */
.hero { display: grid; gap: 16px; padding: 32px; background: var(--surface); border-color: var(--strong); }
.hero p { max-width: 62ch; }
@media (max-width: 560px) { .hero { padding: 22px; } }
.theme-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 720px) { .theme-grid { grid-template-columns: 1fr; } }
.theme-card { display: flex; flex-direction: column; gap: 12px; }
.ph {
  height: 84px; border: 1px solid var(--line); display: grid; place-items: center;
  background:
    linear-gradient(to top right, transparent calc(50% - 0.5px), var(--line) 50%, transparent calc(50% + 0.5px)),
    linear-gradient(to top left, transparent calc(50% - 0.5px), var(--line) 50%, transparent calc(50% + 0.5px));
}
.ph span { background: var(--bg); padding: 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; }
.svc { margin: 0; padding-left: 18px; display: grid; gap: 2px; font-size: 14px; }
.card-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 12px; border-top: 1px dashed var(--line); }
.info-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 820px) { .info-grid { grid-template-columns: 1fr; } }
.info-grid .box { display: grid; gap: 6px; align-content: start; font-size: 14px; }

/* Voice (음성으로 상품 찾기) */
.voice { display: grid; gap: 14px; }
.voice-row { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.voice-status { font-size: 14px; color: var(--muted); min-width: 0; }
.voice-status.is-on { color: var(--accent); font-weight: 500; }
.voice-status.is-err { color: var(--danger); }
.btn.is-listening { background: var(--accent-weak); border-color: var(--accent); color: var(--accent); }
.voice-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
.voice-form .fld { flex: 1 1 260px; }

/* Booking */
.crumbs { font-size: 13px; color: var(--muted); }
.crumbs a { color: var(--muted); }
.book-head { display: grid; gap: 10px; background: var(--surface); border-color: var(--strong); }
.book-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .book-grid { grid-template-columns: 1fr; } }
.steps { display: flex; flex-direction: column; gap: 20px; min-width: 0; margin: 0; }
.step { display: grid; gap: 20px; min-width: 0; }
.step-title { display: flex; align-items: center; gap: 10px; font-size: 16px; }
.step-no { font-family: var(--font-mono); font-size: 12px; font-weight: 500; width: 24px; height: 24px; display: inline-grid; place-items: center; border: 1px solid var(--strong); border-radius: 50%; flex: none; }
.field { display: grid; gap: 8px; min-width: 0; }
.field-head { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; }
.field-head .t { font-weight: 600; font-size: 14px; }
.opts { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.opts.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 600px) { .opts.cols-3 { grid-template-columns: 1fr; } }
.opt { position: relative; display: block; cursor: pointer; min-width: 0; }
.opt input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.opt-body { display: flex; flex-direction: column; gap: 2px; height: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); font-size: 14px; }
.opt:hover .opt-body { border-color: var(--muted); }
.opt input:checked + .opt-body { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-weak); }
.opt input:focus-visible + .opt-body { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt.is-disabled, .opt.is-disabled input { cursor: not-allowed; }
.opt.is-disabled .opt-body { background: var(--surface); border-style: dashed; color: var(--muted); }
.opt-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; white-space: nowrap; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg .opt-body { padding: 6px 14px; }
.check .opt-body { flex-direction: row; align-items: center; gap: 10px; }
.check .box-mark { width: 16px; height: 16px; border: 1px solid var(--muted); border-radius: 2px; flex: none; display: grid; place-items: center; font-size: 12px; line-height: 1; }
.check input:checked + .opt-body .box-mark { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.check input:checked + .opt-body .box-mark::after { content: "✓"; }
.stepper { display: inline-flex; align-items: stretch; border: 1px solid var(--strong); border-radius: var(--r); }
.stepper .btn { border: 0; border-radius: 0; width: 40px; height: 38px; padding: 0; font-size: 18px; }
.stepper output { min-width: 64px; display: grid; place-items: center; border-inline: 1px solid var(--line); font-weight: 600; }
.fixed-pax { padding: 8px 12px; border: 1px dashed var(--line); background: var(--surface); font-size: 14px; }

.summary {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px);
  max-height: calc(100vh - 96px); overflow: auto;
  display: grid; gap: 14px; border-color: var(--strong);
}
@media (max-width: 900px) { .summary { position: static; max-height: none; } }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; margin: 0; font-size: 13px; }
.kv dt { color: var(--muted); white-space: nowrap; }
.kv dd { margin: 0; text-align: right; }
.kv-left { grid-template-columns: 96px minmax(0, 1fr); font-size: 14px; gap: 8px 14px; }
.kv-left dd { text-align: left; }
.depart { font-size: 13px; padding: 10px 12px; border: 1px dashed var(--line); background: var(--surface); display: grid; gap: 4px; justify-items: start; }
.price { width: 100%; border-collapse: collapse; font-size: 13px; }
.price td { padding: 6px 0; border-bottom: 1px dashed var(--line); vertical-align: top; }
.price td.r { text-align: right; white-space: nowrap; padding-left: 10px; }
.price .f { display: block; color: var(--muted); font-size: 12px; }
.sum-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 14px; }
.total { border-top: 1px solid var(--strong); padding-top: 10px; font-weight: 700; }
.total strong { font-size: 20px; }

/* Forms */
.narrow { width: 100%; max-width: 460px; margin-inline: auto; }
.narrow.wide { max-width: 680px; }
.form-box { display: grid; gap: 18px; padding: 28px; }
@media (max-width: 480px) { .form-box { padding: 20px; } }
.stack { display: grid; gap: 14px; }
.fld { display: grid; gap: 4px; font-size: 14px; }
.fld > span { font-weight: 500; }
.fld input {
  font: inherit; font-size: 15px; width: 100%; padding: 9px 11px;
  border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); color: var(--fg);
}
.fld input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.fld input[aria-invalid="true"] { border-color: var(--danger); }
.err { color: var(--danger); font-size: 13px; }
.hint { color: var(--muted); font-size: 12px; }
.alert { padding: 10px 12px; border: 1px solid var(--warn); background: var(--warn-weak); font-size: 14px; }
.demo-hint { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; padding: 12px; border: 1px dashed var(--line); background: var(--surface); }

/* Payment (모의 결제) */
.fld select { font: inherit; font-size: 15px; width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); color: var(--fg); }
.fld select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.pay-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .pay-grid { grid-template-columns: 1fr; } }
.pay-form { display: grid; gap: 20px; }
.card-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 560px) { .card-row { grid-template-columns: 1fr 1fr; } .card-row .fld:first-child { grid-column: 1 / -1; } }
.mock-note { font-size: 13px; padding: 10px 12px; border: 1px dashed var(--warn); background: var(--warn-weak); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.agree { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; cursor: pointer; }
.agree input { margin-top: 4px; width: 16px; height: 16px; flex: none; }
.processing { display: grid; gap: 12px; justify-items: center; text-align: center; padding: 34px 22px; }
.spinner { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.receipt { border: 1px solid var(--line); background: var(--surface); padding: 14px; display: grid; gap: 8px; }

/* My page / done */
.my-grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; }
@media (max-width: 760px) { .my-grid { grid-template-columns: 1fr; } }
.my-grid .box { display: grid; gap: 12px; align-content: start; }
.tier-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 18px; font-weight: 700; }
.meter { height: 6px; background: var(--surface); border: 1px solid var(--line); }
.meter i { display: block; height: 100%; background: var(--accent); }
.done { display: grid; gap: 18px; }
.sms-box { border: 1px solid var(--ok); background: var(--ok-weak); padding: 14px; display: grid; gap: 6px; font-size: 14px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* Modal + toasts */
#modal { position: fixed; inset: 0; z-index: 50; }
.overlay {
  position: absolute; inset: 0; background: var(--scrim); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.dialog { width: min(760px, 100%); max-height: 100%; overflow: auto; background: var(--bg); border: 1px solid var(--strong); padding: 22px; display: grid; gap: 14px; }
.dialog.sm { width: min(460px, 100%); }
.dialog-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.dialog-foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
#toasts {
  position: fixed; z-index: 60; display: grid; gap: 8px;
  right: calc(env(safe-area-inset-right, 0px) + 16px); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  width: min(340px, calc(100vw - 32px));
}
.toast { background: var(--bg); border: 1px solid var(--strong); padding: 12px 14px; font-size: 14px; box-shadow: 0 8px 24px var(--shadow); display: grid; gap: 4px; }
.toast.sms { border-color: var(--ok); }
.toast-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.x { border: 0; background: none; color: var(--muted); font: inherit; font-size: 18px; line-height: 1; padding: 2px 4px; cursor: pointer; }

/* Footer */
.site-foot { border-top: 1px solid var(--line); }
.site-foot .wrap { padding-block: 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }

/* ===== 밝은 스카이 블루 테마 (시안 A) — 위 기본 스타일 위에 덮어씀 ===== */
body { font-size: 15px; word-break: keep-all; overflow-wrap: anywhere; }
@media (max-width: 560px) { .hero h1 br { display: none; } }
.view.view-tight { gap: 20px; }
.sec-head h2.h-sm { font-size: 18px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
h1 { font-weight: 800; letter-spacing: -0.02em; }
h2 { font-weight: 800; letter-spacing: -0.01em; }
.box { border-color: var(--line); border-radius: var(--r-lg); padding: 24px; }
.label { font-family: var(--font-mono); font-weight: 600; font-size: 12px; letter-spacing: 0.12em; color: var(--accent-ink); }
.btn { border-color: var(--strong); border-radius: var(--r); padding: 10px 16px; font-weight: 700; font-size: 15px; min-height: 44px; }
.btn-primary { border-color: var(--accent); }
.btn-sm { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.badge { border: 0; padding: 2px 10px; font-weight: 700; }
.st-done, .st-cancel { background: var(--surface); }
.chip { color: var(--body); background: var(--surface); border: 0; border-radius: 8px; padding: 4px 10px; font-size: 13px; }
.sec-head { border-bottom: 0; padding-bottom: 0; margin-bottom: 22px; align-items: flex-end; }
.sec-head h2 { font-size: clamp(24px, 3vw, 30px); }
.sec-title { display: grid; gap: 6px; }
.sec-sub { font-size: 15px; color: var(--muted); }
.tbl-wrap { border-radius: var(--r-lg); }

/* 헤더 */
.site-head { border-bottom: 1px solid var(--line); }
.site-head .wrap { min-height: 68px; }
.logo { gap: 10px; }
.logo-mark { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; }
.logo b { font-family: var(--font-mono); font-weight: 700; font-size: 20px; letter-spacing: 0.02em; }
.nav { font-size: 15px; gap: 6px 14px; }
.nav a:not(.btn) { font-weight: 500; padding: 8px 4px; }
.nav a.is-active { color: var(--accent); text-decoration: none; box-shadow: inset 0 -2px 0 var(--accent); }

/* 홈: 첫 화면 + 말로 찾기 검색창 */
.view { gap: 64px; }
.hero { background: var(--sky); border: 0; border-radius: 28px; padding: 56px 48px; gap: 20px; }
.hero .badge-pill { justify-self: start; font-family: var(--font-mono); font-weight: 600; font-size: 13px; letter-spacing: 0.12em; color: var(--accent-ink); background: var(--bg); border-radius: 999px; padding: 7px 14px; }
.hero h1 { font-size: clamp(28px, 4.2vw, 44px); line-height: 1.3; max-width: 820px; }
.hero p.lead { font-size: 18px; line-height: 1.7; color: #3b4a5e; max-width: 720px; }
@media (max-width: 560px) { .hero { padding: 30px 20px; border-radius: 24px; } .hero p.lead { font-size: 15px; } }

<script>
(function () {
  'use strict';

  /* ---------------- 서버 API 호출 ---------------- */
  // 회원·예약·상품 데이터는 서버(DB)에 저장된다. 실패하면 서버의 error 메시지로 예외를 던진다.
  async function api(method, url, body) {
    const res = await fetch('/api' + url, {
      method, credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: body === undefined ? undefined : JSON.stringify(body)
    });
    let data = null;
    try { data = await res.json(); } catch (e) { /* 빈 응답 */ }
    if (!res.ok) {
      const err = new Error((data && data.error) || `요청에 실패했습니다 (${res.status})`);
      err.status = res.status; err.data = data;
      throw err;
    }
    return data;
  }

  /* ---------------- Helpers ---------------- */
  // DOM 요소 하나 찾기
  const $ = (s, r = document) => r.querySelector(s);
  // HTML 특수문자 이스케이프 (XSS 방지)
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  // 'YYYY-MM-DD' 문자열 → Date
  const fromKey = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const DOW = ['일', '월', '화', '수', '목', '금', '토'];
  // 숫자를 '1,000원' 형식으로
  const won = n => Number(n).toLocaleString('ko-KR') + '원';
  const fmtShort = s => { const d = fromKey(s); return `${pad(d.getMonth() + 1)}.${pad(d.getDate())} (${DOW[d.getDay()]})`; };
  // 여행 기간 표시: 시작일 – 종료일 (N박 N+1일)
  const fmtPeriod = (s, nights) => {
    const a = fromKey(s), b = addDays(a, nights);
    const end = b.getFullYear() !== a.getFullYear() ? `${b.getFullYear()}.${pad(b.getMonth() + 1)}.${pad(b.getDate())}` : `${pad(b.getMonth() + 1)}.${pad(b.getDate())}`;
    return `${a.getFullYear()}.${pad(a.getMonth() + 1)}.${pad(a.getDate())} – ${end} (${nights}박 ${nights + 1}일)`;
  };

  /* ---------------- Domain data (서버 /api/catalog 에서 불러옴, 직원 화면에서 수정 가능) ---------------- */
  let THEMES = {}, STYLES = {}, HOTELS = {}, MEALS = {}, VEHICLES = {}, ADDONS = {};
  let STYLE_ORDER = [], MEAL_ORDER = [], VEHICLE_ORDER = [], NIGHTS = [2, 3, 4, 5];
  function applyCatalog(c) {
    THEMES = c.themes; STYLES = c.styles; HOTELS = c.hotels; MEALS = c.meals; VEHICLES = c.vehicles; ADDONS = c.addons;
    STYLE_ORDER = c.styleOrder; MEAL_ORDER = c.mealOrder; VEHICLE_ORDER = c.vehicleOrder; NIGHTS = c.nights;
    state.leadDays = c.leadDays;
  }
  // 테마 카드 색·아이콘·사진. 사진 파일이 생기면 img에 주소를 넣으면 된다 (예: 'images/honeymoon.jpg').
  // 직원이 새로 만든 테마는 기본 하늘색 카드로 보인다.
  const THEME_LOOK = {
    honeymoon: { tint: '#fdecf2', ink: '#a8174e', photo: '해변 리조트', img: '', icon: 'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z' },
    parents: { tint: '#e8f5ec', ink: '#1f6b3a', photo: '온천 · 고택', img: '', icon: 'M5 19c8 0 14-6 14-14-8 0-14 6-14 14zM5 19l7-7' },
    golf: { tint: '#e3f4f4', ink: '#0b6b70', photo: '골프 리조트', img: '', icon: 'M8 21V3l9 4-9 4M5 21h8' },
    trekking: { tint: '#fdf1de', ink: '#8a4b0b', photo: '산 능선', img: '', icon: 'M3 20l6-10 4 6 3-4 5 8z' }
  };
  const lookOf = t => THEME_LOOK[t.id] || { tint: '#eef5ff', ink: '#1d4f91', photo: '', img: '', icon: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18' };
  // 출발 확정 규칙 문구 (허니문: 2팀, 그 외: 3명)
  const unitOf = t => (t.confirmUnit === 'team' ? '팀' : '명');
  const ruleOf = t => `신청 ${t.confirmMin}${unitOf(t)} 이상`;
  // 테마 등급 제한 (예: 허니문·효도는 그랜드 이상)
  const minStyleOf = t => STYLES[t.minStyle];
  const isStyleBlocked = (t, k) => STYLES[k].rank < minStyleOf(t).rank;

  // 예약/초안의 여행지 객체 찾기
  const destOf = b => THEMES[b.theme].dests.find(x => x.id === b.dest) || THEMES[b.theme].dests[0];
  // 실제 과금되는 추가 메뉴 (샴페인 포함 식사면 샴페인 제외)
  const activeAddons = b => Object.keys(ADDONS).filter(k => b.addons.includes(k) && !(k === 'champagne' && MEALS[b.meal].champagne));
  const addonText = b => { const a = activeAddons(b).map(k => ADDONS[k].name); return a.length ? a.join(', ') : '없음'; };
  const configText = b => `${HOTELS[b.hotel].short} · ${MEALS[b.meal].short} · ${VEHICLES[b.vehicle].short}`;
  // 등급 기본값에서 옵션을 바꿨는지 여부
  const isCustomized = b => b.hotel !== STYLES[b.style].hotel || b.meal !== STYLES[b.style].meal || (THEMES[b.theme] && b.vehicle !== THEMES[b.theme].vehicle);

  /* ---------------- Pricing ---------------- */
  // 화면 미리보기용 가격 계산 (예약 시 서버가 같은 방식으로 다시 계산해 확정한다)
  function calc(b, rate) {
    const t = THEMES[b.theme], dest = destOf(b), days = b.nights + 1, p = b.pax;
    const H = HOTELS[b.hotel], M = MEALS[b.meal], V = VEHICLES[b.vehicle];
    const lines = [];
    const add = (name, amount, formula) => { if (amount > 0) lines.push({ name, amount, formula }); };
    add('테마 패키지', t.base * p, `${won(t.base)} × ${p}명`);
    add(`여행지 추가요금 (${dest.name})`, dest.extra * p, `${won(dest.extra)} × ${p}명`);
    add(`호텔 · ${H.name}`, H.price * b.nights * p, `${won(H.price)} × ${b.nights}박 × ${p}명`);
    add(`식사 · ${M.name}`, M.price * days * p, `${won(M.price)} × ${days}일 × ${p}명`);
    add(`교통 · ${V.name}`, V.price * days, `${won(V.price)} × ${days}일`);
    activeAddons(b).forEach(k => {
      const A = ADDONS[k];
      add(`추가 · ${A.name}`, A.price * days * p, `${won(A.price)} × ${days}일 × ${p}명`);
    });
    const subtotal = lines.reduce((s, l) => s + l.amount, 0);
    const discount = Math.round((subtotal * rate) / 100) * 100;
    return { lines, subtotal, discount, total: subtotal - discount };
  }

  /* ---------------- State ---------------- */
  // 화면 상태: 로그인 회원, 내 예약, 출발일 캐시, 예약 초안, 로그인 후 돌아갈 페이지, 알림 문구, 마지막 예약
  const state = {
    user: null, myBookings: null, deps: {}, depLoading: {},
    draft: null, returnTo: null, notice: '', lastBooking: null, lastSms: [], ready: false,
    pay: { method: 'card', bank: '', installment: 0 }, payMethods: {}, banks: []
  };
  // 현재 로그인한 고객 (없으면 null)
  const me = () => state.user;
  const tierOf = () => (state.user && state.user.tier) || { name: '일반 고객', rate: 0, n: 0, next: 1 };

  async function refreshMe() {
    const r = await api('GET', '/me');
    state.user = r.user && r.user.role === 'customer' ? r.user : null;
  }
  async function loadMyBookings() {
    state.myBookings = state.user ? await api('GET', '/me/bookings') : [];
    return state.myBookings;
  }

  /* ---------------- Departure rule (출발 확정: 허니문 2팀 이상, 그 외 3명 이상) ---------------- */
  const depKey = (theme, dest) => `${theme}|${dest}`;
  // 테마·여행지의 출발일 목록 (서버에서 불러와 캐시, 없으면 불러오기 시작하고 null)
  function depsFor(theme, dest) {
    const k = depKey(theme, dest);
    if (state.deps[k]) return state.deps[k];
    if (!state.depLoading[k]) {
      state.depLoading[k] = true;
      api('GET', `/departures?theme=${encodeURIComponent(theme)}&dest=${encodeURIComponent(dest)}`)
        .then(list => { state.deps[k] = list; })
        .catch(e => { state.deps[k] = []; toast(esc(e.message)); })
        .finally(() => {
          state.depLoading[k] = false;
          const d = state.draft;
          if (d && currentRoute() === 'book-' + d.theme && depKey(d.theme, d.dest) === k) {
            // 음성으로 여행지와 출발일을 함께 바꾼 경우: 목록을 받은 뒤 출발일 반영
            if (state.voiceDateWish) {
              const wish = state.voiceDateWish, date = resolveDateWish(wish, state.deps[k], d.date);
              state.voiceDateWish = null;
              if (date) {
                d.date = date;
                const vm = state.bookVoiceMsg;
                if (vm) vm.msg = vm.msg.replace(`${dateWishText(wish)} 출발일 (불러오는 중)`, `${fmtShort(date)} 출발`);
              } else state.bookVoiceMsg = { msg: `${dateWishText(wish)} 출발 일정이 없습니다. 아래 출발일 목록에서 골라 주세요.`, kind: 'err' };
            }
            normalize(d); rerenderBook();
          }
        });
    }
    return null;
  }
  const upcomingDepartures = (theme, dest) => (depsFor(theme, dest) || []).map(x => x.date);
  const depInfo = (theme, dest, date) => (depsFor(theme, dest) || []).find(x => x.date === date) || null;
  const badge = s => `<span class="badge st-${s.key}">${esc(s.label)}</span>`;

  /* ---------------- Voice (음성으로 여행 상품 선택, 고객 인터페이스 2단계) ---------------- */
  // 브라우저 내장 음성인식(Web Speech API, Chrome·Edge). 없으면 글 입력과 테마 카드로 대체
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const VOICE_OK = !!SR;
  // 기본 4개 테마의 추가 키워드. 직원이 새로 만든 테마는 테마 이름·여행지 이름으로 찾는다.
  const VOICE_KEYWORDS = {
    honeymoon: ['허니문', '신혼', '커플', '배우자', '낭만', '로맨틱', '연인', '아내', '남편', '결혼', '와이프'],
    parents: ['효도', '부모', '힐링', '어머니', '아버지', '엄마', '아빠', '어르신', '안마', '지압', '인삼'],
    golf: ['골프', '라운딩', '필드', '티샷'],
    trekking: ['트레킹', '트래킹', '등산', '아웃도어', '산악', '하이킹', '산행']
  };
  const KO_NUM = { 한: 1, 혼자: 1, 두: 2, 둘: 2, 세: 3, 셋: 3, 석: 3, 네: 4, 넷: 4, 다섯: 5, 여섯: 6, 일곱: 7, 여덟: 8, 아홉: 9, 열: 10 };
  const KO_NIGHT = { 일: 1, 이: 2, 삼: 3, 사: 4, 오: 5, 육: 6, 칠: 7 };
  const squash = s => String(s).replace(/\s+/g, '').toLowerCase();
  // 이름에서 검색용 단어 뽑기 (예: '일본 오이타' → 일본, 오이타)
  const nameWords = s => String(s).split(/[\s·()]+/).filter(w => w.length >= 2).map(squash);
  let voiceRec = null;       // 진행 중인 음성인식
  let voiceHandled = false;  // 결과나 오류를 이미 처리했는지

  // 문장 분석: 테마, 여행지, 기간(박), 인원
  function parseUtterance(text) {
    const s = squash(text);
    const scores = {}, destHits = [];
    Object.values(THEMES).forEach(t => {
      const words = (VOICE_KEYWORDS[t.id] || []).concat(nameWords(t.name)[0] || [], squash(t.id),
        nameWords(t.en).filter(w => !['tour', 'travel'].includes(w)));
      let score = 0, first = Infinity;
      [...new Set(words)].forEach(w => { const i = s.indexOf(w); if (i !== -1) { score++; first = Math.min(first, i); } });
      if (score) scores[t.id] = { score, first };
      t.dests.forEach(d => { if (nameWords(d.name).some(w => s.includes(w))) destHits.push({ theme: t.id, dest: d.id, name: d.name }); });
    });
    // 키워드가 가장 많이 나온 테마 (같으면 먼저 말한 테마)
    let theme = Object.keys(scores).sort((a, b) => scores[b].score - scores[a].score || scores[a].first - scores[b].first)[0] || null;
    // 테마 없이 여행지만 말했으면, 그 여행지가 한 테마에만 있을 때 그 테마로
    const destThemes = [...new Set(destHits.map(h => h.theme))];
    if (!theme && destThemes.length === 1) theme = destThemes[0];
    const hit = theme && destHits.find(h => h.theme === theme);
    let nights = null, pax = null, m;
    if ((m = s.match(/(\d+)박/))) nights = Number(m[1]);
    else if ((m = s.match(/(일|이|삼|사|오|육|칠)박/))) nights = KO_NIGHT[m[1]];
    if ((m = s.match(/(\d+)(명|사람|인)/))) pax = Number(m[1]);
    else if ((m = s.match(/(다섯|여섯|일곱|여덟|아홉|한|두|둘|세|셋|석|네|넷|열)(명|사람|분)/))) pax = KO_NUM[m[1]];
    else if (s.includes('혼자')) pax = 1;
    return {
      theme, dest: hit ? hit.dest : null, nights: NIGHTS.includes(nights) ? nights : null, pax,
      ambiguousDest: !theme && destThemes.length > 1 ? destHits[0].name : null
    };
  }
  // 마이크 버튼 모양: 아이콘 버튼(홈 검색창)은 글자 대신 aria-label만 바꾼다
  function setMicButton(btn, listening) {
    btn.classList.toggle('is-listening', listening);
    const label = listening ? '듣는 중… (누르면 중지)' : '음성으로 말하기';
    if (btn.dataset.icon) btn.setAttribute('aria-label', label); else btn.textContent = label;
  }
  // 음성 상태 문구와 버튼 모양 바꾸기
  function setVoiceUi(msg, kind) {
    if (isBookRoute() && kind !== 'on') state.bookVoiceMsg = { msg, kind: kind || '' }; // 예약 화면은 다시 그려도 안내 유지
    const st = $('#voice-status'), btn = $('#voice-btn');
    if (st) { st.textContent = msg; st.className = 'voice-status' + (kind === 'on' ? ' is-on' : kind === 'err' ? ' is-err' : ''); }
    if (btn) setMicButton(btn, kind === 'on');
  }
  // 인식된 문장(후보 여러 개)으로 상품 선택 화면 열기
  function handleUtterance(candidates) {
    const list = candidates.map(t => String(t).trim()).filter(Boolean);
    if (!list.length) { setVoiceUi('말씀을 듣지 못했습니다. 다시 시도해 주세요.', 'err'); return; }
    let ambiguous = null;
    for (const text of list) {
      const r = parseUtterance(text);
      if (!r.theme) { ambiguous = ambiguous || r.ambiguousDest; continue; }
      const t = THEMES[r.theme];
      // 새 예약 초안을 만들고 말한 조건을 미리 채운 뒤 예약 화면으로
      state.deps = {};
      state.draft = newDraft(r.theme);
      state.pay = { method: 'card', bank: '', installment: 0 };
      state.bookVoiceMsg = null; state.voiceDateWish = null;
      if (r.dest) state.draft.dest = r.dest;
      if (r.nights) state.draft.nights = r.nights;
      if (r.pax && !t.fixedPax) state.draft.pax = r.pax;
      normalize(state.draft);
      const picked = [r.dest && destOf(state.draft).name, r.nights && `${state.draft.nights}박 ${state.draft.nights + 1}일`, r.pax && !t.fixedPax && `${state.draft.pax}명`].filter(Boolean);
      toast(`<span class="label">Voice</span><span class="small muted">"${esc(text)}"</span><b>${esc(t.name)}${picked.length ? ' · ' + esc(picked.join(' · ')) : ''}</b>`);
      go('book-' + r.theme);
      return;
    }
    const names = Object.values(THEMES).map(t => t.name.replace(/\s*투어$/, '')).join(', ');
    setVoiceUi(ambiguous
      ? `"${list[0]}" — '${ambiguous}' 여행지는 여러 테마에 있습니다. ${names} 중 어떤 여행인지 함께 말씀해 주세요.`
      : `"${list[0]}"에 맞는 테마를 찾지 못했습니다. ${names} 중에서 말씀해 주세요.`, 'err');
  }
  // 음성인식 시작 (듣는 중에 다시 누르면 중지)
  function startVoice() {
    if (!VOICE_OK) return;
    if (voiceRec) { voiceRec.stop(); return; }
    const rec = new SR();
    rec.lang = 'ko-KR';
    rec.interimResults = false;
    rec.maxAlternatives = 3;
    voiceHandled = false;
    const onBook = isBookRoute();
    rec.onstart = () => setVoiceUi(onBook ? '듣고 있습니다. 바꿀 옵션을 말씀해 주세요.' : '듣고 있습니다. 원하는 여행을 말씀해 주세요.', 'on');
    rec.onresult = e => {
      voiceHandled = true;
      const res = e.results[e.results.length - 1];
      const alts = Array.from(res, a => a.transcript);
      if (isBookRoute()) handleBookUtterance(alts); else handleUtterance(alts);
    };
    rec.onerror = e => {
      voiceHandled = true;
      const msg = {
        'not-allowed': '마이크 사용이 허용되지 않았습니다. 주소창의 마이크 권한을 확인하거나, 아래에 글로 입력해 주세요.',
        'service-not-allowed': '이 환경에서는 음성인식을 쓸 수 없습니다. 아래에 글로 입력해 주세요.',
        'audio-capture': '마이크를 찾지 못했습니다. 마이크 연결을 확인하거나, 아래에 글로 입력해 주세요.',
        'network': '음성인식 서버에 연결하지 못했습니다. 인터넷 연결을 확인하거나, 아래에 글로 입력해 주세요.',
        'no-speech': '말씀을 듣지 못했습니다. 다시 시도해 주세요.',
        'aborted': '음성인식을 중지했습니다.'
      }[e.error] || '음성을 인식하지 못했습니다. 아래에 글로 입력해 주세요.';
      setVoiceUi(msg, e.error === 'aborted' ? '' : 'err');
    };
    rec.onend = () => {
      voiceRec = null;
      if (!voiceHandled) setVoiceUi('말씀을 듣지 못했습니다. 다시 시도해 주세요.', 'err');
      else { const btn = $('#voice-btn'); if (btn) setMicButton(btn, false); }
    };
    voiceRec = rec;
    try { rec.start(); } catch (err) { voiceRec = null; setVoiceUi('음성인식을 시작하지 못했습니다. 아래에 글로 입력해 주세요.', 'err'); }
  }

  /* ---------------- Voice (예약 화면: 말로 옵션 바꾸기) ---------------- */
  const isBookRoute = () => /^book-/.test(currentRoute()) && !!state.draft;
  // 옵션별로 알아듣는 말 (앞쪽이 더 구체적인 말)
  const VOICE_STYLE = { classic: ['클래식'], grand: ['그랜드'], premium: ['프리미엄', '최고등급', '가장좋은등급', '제일좋은등급'] };
  const VOICE_HOTEL = { 3: ['3성', '삼성급'], 4: ['4성', '사성급'], 5: ['5성', '오성급', '최고급호텔', '제일좋은호텔'] };
  const VOICE_MEAL = { lunchbox: ['도시락'], local: ['현지식', '현지음식', '로컬음식', '현지레스토랑'], fine: ['스테이크', '고급레스토랑', '고급식사', '파인다이닝'] };
  const VOICE_VEHICLE = {
    sedan: ['2인전용', '2인고급', '2인차', '세단', '승용차', '소형차'],
    van: ['10인승합', '10인차', '승합', '밴', '버스'],
    none: ['차량미이용', '차량없이', '차없이', '차필요없', '차량필요없', '개별이동', '미이용', '안탈래']
  };
  const VOICE_ADDON = { coffee: ['커피'], champagne: ['샴페인'] };
  const NEG_AFTER = /^(말고|빼고|대신|아니고|아니라)/;              // "도시락 말고 현지식"
  const REMOVE_AFTER = /^.{0,3}(빼|없이|제거|취소|안해|안할|필요없|말아)/; // "커피 빼줘"
  const VOICE_BOOK_HELP = '예) "몰디브로 바꿔줘" · "4박 5일" · "12월 5일 출발" · "한 명 추가" · "프리미엄으로" · "5성급 호텔" · "도시락 말고 현지식" · "커피 추가" · "얼마야?" · "결제할게"';
  state.bookVoiceMsg = null; // 예약 화면 음성 영역의 마지막 안내 (다시 그려도 유지)

  // 문장 s에서 표에 있는 말이 나온 위치 중 "~말고"로 부정되지 않은 마지막 것
  function pickMention(s, table) {
    let best = null;
    Object.keys(table).forEach(key => table[key].forEach(w => {
      let i = s.indexOf(w);
      while (i !== -1) {
        if (!NEG_AFTER.test(s.slice(i + w.length)) && (!best || i > best.i)) best = { key, i, w };
        i = s.indexOf(w, i + 1);
      }
    }));
    return best;
  }
  const koOrNum = v => (/^\d+$/.test(v) ? Number(v) : KO_NUM[v]);
  // 출발일 말하기 해석: { md: 'MM-DD' } | { nth } | { first } | { confirmed } | { next } | { last }
  function parseDateWish(s) {
    const t = s.replace(/\d+박\d+일/g, '');
    let m;
    if ((m = t.match(/(\d{1,2})월(\d{1,2})일/)) || (m = t.match(/(\d{1,2})[/.](\d{1,2})(?!\d)/))) return { md: `${String(m[1]).padStart(2, '0')}-${String(m[2]).padStart(2, '0')}` };
    if ((m = t.match(/(\d{1,2})일(출발|에출발|날|로|에|자)/))) return { day: Number(m[1]) };
    if ((m = t.match(/(첫|두|세|네|다섯|\d+)번째(출발|날짜|일정|토요일)?/)) && /(출발|날짜|일정|토요일|번째)/.test(t)) return { nth: m[1] === '첫' ? 1 : koOrNum(m[1]) };
    if (/(가장|제일)?빠른(날|출발|일정|날짜)/.test(t)) return { first: true };
    if (/확정된(날|일정|출발|날짜)|이미확정|확정(일정|날짜)/.test(t)) return { confirmed: true };
    if (/(다음|그다음)(출발|날짜|일정|주|토요일)/.test(t)) return { next: true };
    if (/마지막(출발|날짜|일정)/.test(t)) return { last: true };
    return null;
  }
  // 출발일 목록에서 바라는 날짜 고르기 (없으면 null)
  function resolveDateWish(wish, deps, current) {
    if (!wish || !deps || !deps.length) return null;
    if (wish.md) return (deps.find(x => x.date.slice(5) === wish.md) || {}).date || null;
    if (wish.day) return (deps.find(x => Number(x.date.slice(8)) === wish.day) || {}).date || null;
    if (wish.nth) return deps[wish.nth - 1] ? deps[wish.nth - 1].date : null;
    if (wish.first) return deps[0].date;
    if (wish.last) return deps[deps.length - 1].date;
    if (wish.confirmed) return (deps.find(x => x.confirmed) || {}).date || null;
    if (wish.next) { const i = deps.findIndex(x => x.date === current); return deps[i + 1] ? deps[i + 1].date : null; }
    return null;
  }
  const dateWishText = w => w.md ? `${Number(w.md.slice(0, 2))}월 ${Number(w.md.slice(3))}일` : w.day ? `${w.day}일` : w.nth ? `${w.nth}번째` : w.confirmed ? '출발 확정된' : w.next ? '다음' : w.last ? '마지막' : '가장 빠른';

  // 예약 화면에서 들은 문장을 해석해 옵션에 반영. 반영한 것과 못 한 것을 알려 준다.
  function applyBookUtterance(text) {
    const d = state.draft, t = THEMES[d.theme], s = squash(text), min = minStyleOf(t);
    const done = [], warn = [];
    let m, any = false;

    // 1) 여행지 (이 테마의 여행지만)
    const destHit = pickMention(s, Object.fromEntries(t.dests.map(x => [x.id, nameWords(x.name)])));
    if (destHit && destHit.key !== d.dest) { d.dest = destHit.key; any = true; done.push(destOf(d).name); }
    else if (destHit) any = true;

    // 2) 기간
    let nights = null;
    if ((m = s.match(/(\d+)박/))) nights = Number(m[1]);
    else if ((m = s.match(/(일|이|삼|사|오|육|칠)박/))) nights = KO_NIGHT[m[1]];
    else if (/(하루|일정|기간)(더|늘려|늘리|추가|연장)/.test(s)) nights = d.nights + 1;
    else if (/(하루|일정|기간)(줄여|줄이|빼|단축)/.test(s)) nights = d.nights - 1;
    if (nights !== null) {
      any = true;
      if (NIGHTS.includes(nights)) { if (nights !== d.nights) { d.nights = nights; done.push(`${nights}박 ${nights + 1}일`); } }
      else warn.push(`기간은 ${NIGHTS.map(n => n + '박').join('·')} 중에서 고를 수 있습니다.`);
    }

    // 3) 인원 (상대: "한 명 추가", 절대: "4명")
    const before = d.pax;
    let pax = null;
    if ((m = s.match(/(\d+|한|두|세|네|다섯|여섯)(명|사람|분)?(추가|더|늘려|늘리|증가)/)) && (m[2] || /인원|사람/.test(s) || m[3] === '추가')) pax = d.pax + koOrNum(m[1]);
    else if ((m = s.match(/(\d+|한|두|세|네|다섯|여섯)(명|사람|분)?(빼|줄여|줄이|감소|제외|취소)/)) && (m[2] || /인원|사람/.test(s))) pax = d.pax - koOrNum(m[1]);
    else if (/인원(추가|늘려|늘리|더)/.test(s)) pax = d.pax + 1;
    else if (/인원(줄여|줄이|빼)/.test(s)) pax = d.pax - 1;
    else if ((m = s.match(/(\d+)(명|사람|분|인(?!승합|고급|전용|차|용))/))) pax = Number(m[1]);
    else if ((m = s.match(/(다섯|여섯|일곱|여덟|아홉|한|두|둘|세|셋|석|네|넷|열)(명|사람|분)/))) pax = KO_NUM[m[1]];
    else if (s.includes('혼자')) pax = 1;
    if (pax !== null) {
      any = true;
      if (t.fixedPax) warn.push(`${t.name}은(는) ${t.fixedPax}인 전용 상품이라 인원을 바꿀 수 없습니다.`);
      else if (pax < 1) warn.push('인원은 1명 이상이어야 합니다.');
      else if (pax > t.maxPax) { d.pax = t.maxPax; warn.push(`최대 ${t.maxPax}명까지라 ${t.maxPax}명으로 맞췄습니다.`); }
      else d.pax = pax;
      if (d.pax !== before) done.push(`${d.pax}명`);
    }

    // 4) 투어 등급 (호텔·식사는 그 등급 기본값으로 바뀜)
    const styleHit = pickMention(s, VOICE_STYLE);
    if (styleHit) {
      any = true;
      if (isStyleBlocked(t, styleHit.key)) warn.push(`이 상품은 ${min.name} 스타일 이상만 고를 수 있습니다.`);
      else if (styleHit.key !== d.style) { d.style = styleHit.key; d.hotel = STYLES[d.style].hotel; d.meal = STYLES[d.style].meal; done.push(`${STYLES[d.style].name} 스타일`); }
    }

    // 5) 기본 구성으로 되돌리기
    if (/(기본구성|기본으로|원래대로|초기화|처음대로)/.test(s)) {
      any = true;
      d.hotel = STYLES[d.style].hotel; d.meal = STYLES[d.style].meal; d.vehicle = t.vehicle; d.addons = [];
      done.push(`${STYLES[d.style].name} 기본 구성`);
    }

    // 6) 호텔
    const hotelHit = pickMention(s, VOICE_HOTEL);
    if (hotelHit) {
      any = true;
      const h = Number(hotelHit.key);
      if (h < min.hotel) warn.push(`이 상품은 ${HOTELS[min.hotel].name} 이상만 고를 수 있습니다.`);
      else if (h !== d.hotel) { d.hotel = h; done.push(HOTELS[h].name); }
    }

    // 7) 식사
    const mealHit = pickMention(s, VOICE_MEAL);
    if (mealHit) {
      any = true;
      if (MEALS[mealHit.key].lv < MEALS[min.meal].lv) warn.push(`이 상품은 ${MEALS[min.meal].name} 이상만 고를 수 있습니다.`);
      else if (mealHit.key !== d.meal) { d.meal = mealHit.key; done.push(MEALS[d.meal].name); }
    }

    // 8) 교통
    const vehHit = pickMention(s, VOICE_VEHICLE);
    if (vehHit) {
      any = true;
      const V = VEHICLES[vehHit.key];
      if (V.cap < d.pax) warn.push(`${V.name}은(는) ${V.cap}명까지 탈 수 있어 지금 인원(${d.pax}명)에는 고를 수 없습니다.`);
      else if (vehHit.key !== d.vehicle) { d.vehicle = vehHit.key; done.push(V.name); }
    }

    // 9) 추가 메뉴 ("커피 추가" / "커피 빼줘")
    Object.keys(VOICE_ADDON).forEach(k => {
      const w = VOICE_ADDON[k].find(x => s.includes(x));
      if (!w) return;
      any = true;
      const i = s.lastIndexOf(w), remove = REMOVE_AFTER.test(s.slice(i + w.length));
      if (k === 'champagne' && MEALS[d.meal].champagne) { warn.push('샴페인은 지금 식사(고급 레스토랑)에 이미 포함되어 있습니다.'); return; }
      const has = d.addons.includes(k);
      if (remove && has) { d.addons = d.addons.filter(x => x !== k); done.push(`${ADDONS[k].name} 빼기`); }
      else if (!remove && !has) { d.addons = d.addons.concat(k); done.push(`${ADDONS[k].name} 추가`); }
    });

    // 10) 출발일 (여행지를 바꿨으면 새 목록을 불러온 뒤 반영)
    const wish = parseDateWish(s);
    normalize(d);
    if (wish) {
      any = true;
      const deps = depsFor(d.theme, d.dest);
      if (!deps) { state.voiceDateWish = wish; done.push(`${dateWishText(wish)} 출발일 (불러오는 중)`); }
      else {
        const date = resolveDateWish(wish, deps, d.date);
        if (date) { if (date !== d.date) { d.date = date; done.push(`${fmtShort(date)} 출발`); } }
        else warn.push(`${dateWishText(wish)} 출발 일정이 없습니다. 출발일은 매주 토요일이며 아래 목록에서 고를 수 있습니다.`);
      }
    }
    normalize(d);

    // 11) 금액 묻기 / 결제 진행
    const askPrice = /(얼마|금액|가격|총액|비용)/.test(s);
    const wantPay = /(결제할게|결제해|결제하기|결제진행|결제할래|예약할게|예약해줘|예약할래|신청할게|신청해줘|이걸로할게|이대로할게|이대로예약)/.test(s);
    return { any: any || askPrice || wantPay, done, warn, askPrice, wantPay };
  }

  function handleBookUtterance(candidates) {
    const list = candidates.map(x => String(x).trim()).filter(Boolean);
    if (!list.length) { setVoiceUi('말씀을 듣지 못했습니다. 다시 시도해 주세요.', 'err'); return; }
    const text = list[0], s = squash(text);
    if (/(도움말|뭐라고말|어떻게말|명령어|뭘말|무슨말)/.test(s)) { setVoiceUi(VOICE_BOOK_HELP, ''); return; }
    // 여러 후보 중 알아들은 것이 있는 첫 문장
    const d = state.draft, saved = JSON.stringify(d);
    let r = null, used = text;
    for (const cand of list) {
      Object.assign(d, JSON.parse(saved));
      const x = applyBookUtterance(cand);
      if (x.any) { r = x; used = cand; break; }
    }
    if (!r) {
      Object.assign(d, JSON.parse(saved));
      // 다른 테마를 말했으면 그 테마로 이동 ("골프 여행으로 바꿔줘", "몰디브 가고 싶어")
      const p = parseUtterance(text);
      if (p.theme && p.theme !== d.theme) { handleUtterance(list); return; }
      setVoiceUi(`"${text}" — 바꿀 옵션을 찾지 못했습니다. ${VOICE_BOOK_HELP}`, 'err');
      return;
    }
    const p = calc(d, me() ? tierOf().rate : 0);
    const onlyAsk = r.askPrice && !r.done.length && !r.warn.length && !r.wantPay;
    let msg = `"${used}" → ` + (r.done.length ? `반영했습니다: ${r.done.join(' · ')}.` : onlyAsk || r.wantPay ? '' : '바뀐 옵션이 없습니다.');
    if (r.warn.length) msg += ' ' + r.warn.join(' ');
    if (r.askPrice || r.done.length) msg += ` 결제 예정 금액은 ${won(p.total)}입니다.`;
    setVoiceUi(msg, r.warn.length && !r.done.length ? 'err' : '');
    rerenderBook();
    if (r.done.length) toast(`<span class="label">Voice</span><b>${esc(r.done.join(' · '))}</b><span class="small muted">결제 예정 금액 ${won(p.total)}</span>`);
    if (r.wantPay) {
      if (!d.date) setVoiceUi(msg + ' 출발일을 먼저 골라 주세요.', 'err');
      else { const b = document.getElementById('submit-booking'); if (b) b.click(); }
    }
  }

  /* ---------------- Booking draft ---------------- */
  // 테마 선택 시 기본 예약 초안 (그랜드, 3박, 2명)
  function newDraft(themeId) {
    const t = THEMES[themeId];
    const st = STYLES.grand ? 'grand' : STYLE_ORDER[0];
    return {
      theme: themeId, dest: t.dests[0].id, date: null, nights: 3,
      pax: t.fixedPax || 2, style: st, hotel: STYLES[st].hotel, meal: STYLES[st].meal, vehicle: t.vehicle, addons: []
    };
  }
  // 초안을 규칙에 맞게 보정 (등급 제한, 인원, 차량 정원)
  function normalize(d) {
    const t = THEMES[d.theme];
    if (!t.dests.some(x => x.id === d.dest)) d.dest = t.dests[0].id;
    const dates = depsFor(d.theme, d.dest);
    if (dates && !dates.some(x => x.date === d.date)) d.date = dates.length ? dates[0].date : null;
    if (!NIGHTS.includes(d.nights)) d.nights = NIGHTS.includes(3) ? 3 : NIGHTS[0];
    d.pax = t.fixedPax || Math.min(t.maxPax, Math.max(1, d.pax | 0));
    const min = minStyleOf(t);
    if (isStyleBlocked(t, d.style)) { d.style = t.minStyle; d.hotel = min.hotel; d.meal = min.meal; }
    if (d.hotel < min.hotel) d.hotel = min.hotel;
    if (MEALS[d.meal].lv < MEALS[min.meal].lv) d.meal = min.meal;
    if (VEHICLES[d.vehicle].cap < d.pax) d.vehicle = VEHICLE_ORDER.find(v => VEHICLES[v].cap >= d.pax) || d.vehicle;
    return d;
  }

  /* ---------------- Routing ---------------- */
  const app = $('#app'), nav = $('#nav'), modal = $('#modal'), toasts = $('#toasts');
  // 주소의 #해시로 현재 화면 결정
  const currentRoute = () => decodeURIComponent(location.hash.slice(1)) || 'home';
  // 화면 이동
  function go(name) {
    if (currentRoute() === name) { render(); window.scrollTo(0, 0); }
    else location.hash = name;
  }
  window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

  // 현재 해시에 맞는 화면 그리기
  function render() {
    if (!state.ready) return;
    const r = currentRoute();
    let html;
    if (r === 'login') html = viewLogin();
    else if (r === 'signup') html = viewSignup();
    else if (r === 'mypage') {
      if (!me()) { state.returnTo = 'mypage'; state.notice = '마이페이지는 로그인 후 이용할 수 있습니다.'; go('login'); return; }
      if (!state.myBookings) {
        html = '<p class="muted">예약 내역을 불러오는 중…</p>';
        loadMyBookings().then(() => { if (currentRoute() === 'mypage') render(); }).catch(e => toast(esc(e.message)));
      } else html = viewMypage();
    } else if (r.startsWith('book-') && THEMES[r.slice(5)]) {
      const id = r.slice(5);
      if (!state.draft || state.draft.theme !== id) { state.deps = {}; state.draft = newDraft(id); state.pay = { method: 'card', bank: '', installment: 0 }; state.bookVoiceMsg = null; } // 새로 들어올 때 최신 신청 현황
      normalize(state.draft);
      html = viewBook();
    } else if (r === 'pay') {
      if (!state.draft || !state.draft.date) { go('home'); return; }
      if (!me()) { state.returnTo = 'pay'; state.notice = '결제하려면 로그인이 필요합니다. 선택한 내용은 그대로 유지됩니다.'; go('login'); return; }
      html = viewPay();
    } else if (r === 'done' && state.lastBooking) html = viewDone();
    else html = viewHome();
    renderNav(r);
    app.innerHTML = html;
  }
  // 예약 화면만 다시 그리기 (스크롤·포커스 유지)
  function rerenderBook() {
    const active = document.activeElement && document.activeElement.id;
    const y = window.scrollY;
    app.innerHTML = viewBook();
    window.scrollTo(0, y);
    if (active) { const el = document.getElementById(active); if (el) el.focus({ preventScroll: true }); }
  }

  }

  // 여행 상품 선택(예약) 화면
  function viewBook() {
    const d = state.draft, t = THEMES[d.theme], dest = destOf(d), st = STYLES[d.style];
    const u = me(), tier = u ? tierOf() : null, rate = tier ? tier.rate : 0, p = calc(d, rate);
    const minSt = minStyleOf(t), restricted = minSt.rank > 1, unit = unitOf(t);
    const deps = depsFor(d.theme, d.dest);
    const info = d.date ? depInfo(d.theme, d.dest, d.date) : null;
    const cur = info ? info.progress : 0, after = cur + (t.confirmUnit === 'team' ? 1 : d.pax);
    const myAdd = t.confirmUnit === 'team' ? '내 신청 1팀' : `내 신청 ${d.pax}명`;
    const changed = on => on ? '<span class="badge badge-accent">변경됨</span>' : '';
    const vm = state.bookVoiceMsg;

    const destOpts = t.dests.map(x => opt('dest', x.id, d.dest === x.id,
      `<span class="opt-top"><b>${esc(x.name)}</b><span class="tag">${x.region}</span></span>
       <span class="small muted num">${x.extra ? `1인 +${won(x.extra)}` : '추가요금 없음'}</span>`)).join('');
    const nightOpts = NIGHTS.map(n => opt('nights', n, d.nights === n, `${n}박 ${n + 1}일`)).join('');
    const dateOpts = !deps ? '<p class="small muted">출발일을 불러오는 중…</p>'
      : !deps.length ? '<p class="small muted">예약 가능한 출발일이 없습니다. 다른 여행지를 선택해 주세요.</p>'
      : deps.map(x => {

  // 결제 화면 (모의 결제 — 실제 결제는 이루어지지 않음)

    if (pay.method === 'card') {

          <label class="fld"><span>CVC</span><input id="card-cvc" inputmode="numeric" autocomplete="off" placeholder="000" maxlength="3" type="password"><span class="err" data-perr="card-cvc" hidden></span></label>
        </div>
        <label class="fld"><span>할부</span><select id="card-inst">${[0, 2, 3, 6, 12].map(n => `<option value="${n}"${pay.installment === n ? ' selected' : ''}>${n ? n + '개월' : '일시불'}</option>`).join('')}</select></label>`;
    } else if (pay.method === 'transfer') {

      <div class="pay-grid">

  // 카드 번호 검사 (Luhn 체크섬)
  const luhn = num => {
    let sum = 0;
    for (let i = 0; i < num.length; i++) {
      let n = Number(num[num.length - 1 - i]);
      if (i % 2) { n *= 2; if (n > 9) n -= 9; }
      sum += n;
    }
    return sum % 10 === 0;
  };
  // 결제 입력값 검사 → 서버로 보낼 결제 정보 (카드 번호 전체는 보내지 않음)
  function readPayment() {
    const errs = {}, pay = state.pay, out = { method: pay.method, agree: $('#pay-agree').checked };
    if (pay.method === 'card') {
      const no = $('#card-no').value.replace(/\D/g, ''), exp = $('#card-exp').value.trim(), cvc = $('#card-cvc').value.trim();
      if (no.length !== 16 || !luhn(no)) errs['card-no'] = '카드 번호 16자리를 확인해 주세요.';
      const m = /^(\d{2})\/(\d{2})$/.exec(exp);
      const now = new Date();
      if (!m || +m[1] < 1 || +m[1] > 12 || new Date(2000 + +m[2], +m[1], 1) <= new Date(now.getFullYear(), now.getMonth(), 1)) errs['card-exp'] = '유효기간(MM/YY)을 확인해 주세요.';
      if (!/^\d{3}$/.test(cvc)) errs['card-cvc'] = 'CVC 3자리를 입력해 주세요.';
      out.last4 = no.slice(-4);
      out.installment = Number($('#card-inst').value);
    } else if (pay.method === 'transfer') {
      if (!$('#pay-bank').value) errs['pay-bank'] = '은행을 선택해 주세요.';
      out.bank = $('#pay-bank').value;
    }
    if (!out.agree) errs['pay-agree'] = '결제 진행에 동의해 주세요.';
    document.querySelectorAll('[data-perr]').forEach(el => { const k = el.dataset.perr; el.hidden = !errs[k]; el.textContent = errs[k] || ''; });
    const first = Object.keys(errs)[0];
    if (first) { const el = document.getElementById(first); if (el) el.focus(); return null; }
    return out;
  }

            <dt>결제 상태</dt><dd><span class="badge st-ok">${esc(b.payment.status)}</span></dd>
            <dt>결제 수단</dt><dd>${esc(b.payment.info)}</dd>
            <dt>승인번호</dt><dd><code>${esc(b.payment.approval)}</code></dd>
            <dt>결제 일시</dt><dd class="num">${esc(b.payment.paidAt)}</dd>
            <dt>결제 금액</dt><dd class="num"><b>${won(b.total)}</b></dd>
          </dl></div>` : ''}
        ${notice}
        <dl class="kv kv-left">
          <dt>상품</dt><dd>${esc(b.themeName)}</dd>
          <dt>여행지</dt><dd>${esc(b.destName)} (${b.region})</dd>
          <dt>기간</dt><dd class="num">${fmtPeriod(b.date, b.nights)}</dd>
          <dt>인원</dt><dd>${b.pax}명</dd>
          <dt>투어 등급</dt><dd>${STYLES[b.style].name}${isCustomized(b) ? ' <span class="badge badge-accent">옵션 변경</span>' : ''}</dd>
          <dt>구성</dt><dd>${HOTELS[b.hotel].name} · ${MEALS[b.meal].name} · ${VEHICLES[b.vehicle].name}</dd>
          <dt>추가 메뉴</dt><dd>${addonText(b)}</dd>
          <dt>금액</dt><dd class="num">${won(b.subtotal)}${b.discount ? ` − 할인 ${won(b.discount)} (${Math.round(b.discountRate * 100)}%)` : ''} = <b>${won(b.total)}</b></dd>
        </dl>
        <div class="row">
          <a class="btn btn-primary" href="#mypage">마이페이지에서 확인</a>
          <a class="btn" href="#home">다른 상품 보기</a>
        </div>
      </section>
    </div></div>`;
  }

  // 예약 행의 등급·구성 표시 (판매 중지된 옵션이어도 깨지지 않도록 서버 라벨 사용)
  const styleCell = b => `${esc(b.labels.style)}${STYLES[b.style] && HOTELS[b.hotel] && MEALS[b.meal] && isCustomized(b) ? ' <span class="badge badge-accent">옵션 변경</span>' : ''}<span class="sub">${esc(b.labels.hotel)} · ${esc(b.labels.meal)} · ${esc(b.labels.vehicle)}</span>`;

  // 마이페이지 화면
  function viewMypage() {
    const u = me(), tier = tierOf();
    const mine = state.myBookings || [];
    const progress = tier.next === null ? 100 : Math.round((tier.n / 3) * 100);
    const rows = mine.length ? mine.map(b => {
      const s = b.status;
      const acts = [];
      if (s.key === 'wait' || s.key === 'ok') acts.push(`<button type="button" class="btn btn-sm btn-danger" data-action="ask-cancel" data-id="${esc(b.id)}">취소</button>`);
      return `<tr>
        <td><code>${esc(b.id)}</code></td>
        <td>${esc(b.themeName)}<span class="sub">${esc(b.destName)} · ${b.pax}명</span></td>
        <td class="num">${fmtPeriod(b.date, b.nights)}</td>
        <td>${styleCell(b)}</td>
        <td class="r num">${won(b.total)}${b.discount ? `<span class="sub">할인 ${Math.round(b.discountRate * 100)}%</span>` : ''}${b.payment ? `<span class="sub">${esc(b.payment.status)}</span>` : ''}</td>
        <td>${badge(s)}</td>
        <td><div class="actions">${acts.join('') || '<span class="muted small">–</span>'}</div></td>
      </tr>`;
    }).join('') : `<tr><td colspan="7" class="empty">아직 예약 내역이 없습니다. <a href="#home">테마 상품 보기</a></td></tr>`;

    return `<div class="view view-tight">
      <div><div class="label">My Page</div><h1>마이페이지</h1></div>
      <div class="my-grid">
        <section class="box">
          <h2 class="h-sm">회원 정보</h2>
          <dl class="kv kv-left">
            <dt>아이디</dt><dd>${esc(u.id)}</dd>
            <dt>성명</dt><dd>${esc(u.name)}</dd>
            <dt>주소</dt><dd>${esc(u.address)}</dd>
            <dt>연락처</dt><dd>${esc(u.phone)}</dd>
            <dt>가입일</dt><dd class="num">${esc(u.createdAt.replace(/-/g, '.'))}</dd>
          </dl>
        </section>
        <section class="box">
          <h2 class="h-sm">회원 등급</h2>
          <div class="tier-line">${tier.name}<span class="badge badge-accent">${tier.rate ? `${Math.round(tier.rate * 100)}% 할인` : '할인 없음'}</span></div>
          <div class="meter" role="img" aria-label="단골 고객까지 진행도 ${progress}%"><i style="width:${progress}%"></i></div>
          <p class="small muted">완료된 여행 ${tier.n}회. ${tier.next === null ? '최고 등급입니다.' : `${tier.next}회 더 다녀오시면 ${tier.n === 0 ? '우수 고객(5%)' : '단골 고객(10%)'}이 됩니다.`}</p>
          <p class="small muted">기준: 1–2회 우수 고객 5% · 3회 이상 단골 고객 10%</p>
        </section>
      </div>
      <section>
        <div class="sec-head"><h2>예약 · 여행 내역</h2><div class="row"><button type="button" class="btn btn-sm" data-action="show-sms" id="show-sms">문자함</button><button type="button" class="btn btn-sm" data-action="show-history" id="show-history">이전 여행 목록 팝업</button></div></div>
        <div class="tbl-wrap"><table class="tbl" style="min-width:860px">
          <thead><tr><th>예약번호</th><th>상품</th><th>기간</th><th>투어 등급</th><th class="r">가격</th><th>상태</th><th>관리</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
        <p class="note">같은 출발일에 다른 고객의 신청이 더해져 확정 기준에 도달하면 출발이 확정되고 문자가 발송됩니다. 받은 문자는 '문자함'에서 다시 볼 수 있습니다.</p>
      </section>
    </div>`;
  }

  /* ---------------- Modal & toasts ---------------- */
  // 팝업 열기
  function openModal(html) {
    modal.innerHTML = `<div class="overlay" data-overlay>${html}</div>`;
    modal.hidden = false;
    const f = modal.querySelector('[data-autofocus]') || modal.querySelector('button, a');
    if (f) f.focus();
  }
  // 팝업 닫기
  function closeModal() { modal.hidden = true; modal.innerHTML = ''; }
  // 화면 오른쪽 아래 알림 메시지 (html은 이스케이프된 문자열이어야 함)
  function toast(html, cls = '', ms = 4500) {
    const el = document.createElement('div');
    el.className = 'toast ' + cls;
    el.innerHTML = html;
    toasts.appendChild(el);
    const timer = setTimeout(() => el.remove(), ms);
    el.addEventListener('click', e => { if (e.target.closest('[data-close]')) { clearTimeout(timer); el.remove(); } });
  }
  // 문자 발송 시뮬레이션 알림
  function showSms(m) {
    toast(`<div class="toast-head"><span class="label">SMS · 발송 시뮬레이션</span><button type="button" class="x" data-close aria-label="닫기">×</button></div>
      <span class="small muted">수신 ${esc(m.phone)}</span><p>${esc(m.message)}</p>`, 'sms', 14000);
  }
  // 로그인 시 확인하지 않은 문자를 알림으로 보여주고 읽음 처리
  async function showUnreadSms() {
    try {
      const list = await api('GET', '/me/sms?unread=1');
      list.slice(0, 3).forEach(showSms);
      if (list.length) await api('POST', '/me/sms/read');
    } catch (e) { /* 알림 실패는 무시 */ }
  }
  // 문자함 팝업
  async function showSmsBox() {
    let list;
    try { list = await api('GET', '/me/sms'); } catch (e) { toast(esc(e.message)); return; }
    const rows = list.length ? list.map(m => `<tr><td class="num small">${esc(m.createdAt.slice(0, 16))}</td><td>${esc(m.message)}</td></tr>`).join('')
      : '<tr><td colspan="2" class="empty">받은 문자가 없습니다.</td></tr>';
    openModal(`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="sms-title">
      <div class="dialog-head">
        <div><div class="label">SMS Inbox · 발송 시뮬레이션</div><h2 id="sms-title">받은 문자</h2></div>
        <button type="button" class="x" data-action="close-modal" aria-label="닫기">×</button>
      </div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>수신 일시</th><th>내용</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="dialog-foot"><button type="button" class="btn btn-primary" data-action="close-modal" data-autofocus>확인</button></div>
    </div>`);
  }

  // 이전 여행 목록 팝업 (최근 출발일 순)
  async function showHistory() {
    const u = me(); if (!u) return;
    try { await loadMyBookings(); } catch (e) { toast(esc(e.message)); return; }
    const tier = tierOf();
    const list = state.myBookings.filter(b => !b.cancelled);
    const rows = list.length ? list.map(b => `<tr>
        <td>${esc(b.themeName)}<span class="sub">${esc(b.destName)} · ${b.pax}명</span></td>
        <td class="num">${fmtPeriod(b.date, b.nights)}</td>
        <td>${styleCell(b)}</td>
        <td class="r num">${won(b.total)}</td>
        <td>${badge(b.status)}</td></tr>`).join('')
      : `<tr><td colspan="5" class="empty">아직 여행 내역이 없습니다. 첫 여행을 계획해 보세요.</td></tr>`;
    openModal(`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="hist-title">
      <div class="dialog-head">
        <div><div class="label">Previous Trips</div><h2 id="hist-title">${esc(u.name)}님의 이전 여행 목록</h2></div>
        <button type="button" class="x" data-action="close-modal" aria-label="닫기">×</button>
      </div>
      <p class="small muted">${tier.name} · 완료된 여행 ${tier.n}회${tier.rate ? ` · 다음 예약에 ${Math.round(tier.rate * 100)}% 할인이 적용됩니다` : ''} · 최근 순</p>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>상품</th><th>기간</th><th>투어 등급</th><th class="r">가격</th><th>상태</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <div class="dialog-foot">
        <a class="btn" href="#mypage" data-action="close-modal">마이페이지</a>
        <button type="button" class="btn btn-primary" data-action="close-modal" data-autofocus id="hist-ok">확인</button>
      </div>
    </div>`);
  }

  /* ---------------- Actions ---------------- */
  // 모의 결제 → 예약을 서버에 저장 후 완료 화면으로 이동
  async function doPay() {
    const u = me(), d = state.draft; if (!u || !d) return;
    const payment = readPayment();
    if (!payment) return;
    const p = calc(d, tierOf().rate);
    const err = $('#pay-err');
    err.hidden = true;
    openModal(`<div class="dialog sm processing" role="alertdialog" aria-modal="true" aria-label="결제 승인 중"><div class="spinner" aria-hidden="true"></div><b>결제 승인 중입니다</b><span class="small muted">창을 닫지 말고 잠시 기다려 주세요. (모의 결제)</span></div>`);
    await new Promise(r => setTimeout(r, 1200));
    try {
      const r = await api('POST', '/bookings', Object.assign({}, d, { addons: d.addons.slice(), expectedTotal: p.total, payment }));
      state.lastBooking = r.booking;
      state.lastSms = r.sms || [];
      state.draft = null;
      state.myBookings = null;
      delete state.deps[depKey(r.booking.theme, r.booking.dest)];
      await api('POST', '/me/sms/read').catch(() => {});
      closeModal();
      go('done');
      state.lastSms.forEach(showSms);
    } catch (e) {
      closeModal();
      // 가격·출발일이 바뀐 경우 최신 정보로 다시 계산해 안내
      if (e.status === 409 || e.status === 400) {
        try { applyCatalog(await api('GET', '/catalog')); } catch (x) { /* ignore */ }
        delete state.deps[depKey(d.theme, d.dest)];
      }
      const e2 = $('#pay-err');
      if (e2) { e2.textContent = e.message + ' 결제는 진행되지 않았습니다.'; e2.hidden = false; }
    }
  }
  // 로그인 처리
  async function doLogin(form) {
    const id = form.elements.uid.value.trim(), pw = form.elements.upw.value;
    const err = $('#login-err');
    const fail = msg => { err.textContent = msg; err.hidden = false; };
    if (!id || !pw) return fail('아이디와 비밀번호를 입력해 주세요.');
    try {
      const r = await api('POST', '/auth/login', { uid: id, upw: pw });
      if (r.user.role !== 'customer') {
        await api('POST', '/auth/logout');
        return fail('직원 계정입니다. 직원 포털(/staff)에서 로그인해 주세요.');
      }
      loginAs(r.user);
    } catch (e) { fail(e.message); }
  }
  // 로그인 후 원래 페이지로 이동하고 이전 여행 팝업 + 받은 문자 표시
  function loginAs(user) {
    state.user = user;
    state.myBookings = null;
    const dest = state.returnTo || 'home';
    state.returnTo = null;
    go(dest);
    showHistory();
    showUnreadSms();
  }
  // 회원가입 입력값 검사 후 서버에 저장
  async function doSignup(form) {
    const v = n => form.elements[n].value.trim();
    const errs = {};
    const id = v('uid'), pw = form.elements.upw.value, pw2 = form.elements.upw2.value;
    const name = v('uname'), addr = v('uaddr'), phoneRaw = v('uphone').replace(/[^0-9]/g, '');
    if (!/^[A-Za-z0-9_]{3,16}$/.test(id)) errs.uid = '영문, 숫자 3–16자로 입력해 주세요.';
    if (pw.length < 4) errs.upw = '비밀번호를 4자 이상 입력해 주세요.';
    if (pw2 !== pw || !pw2) errs.upw2 = '비밀번호가 일치하지 않습니다.';
    if (!name) errs.uname = '성명을 입력해 주세요.';
    if (!addr) errs.uaddr = '주소를 입력해 주세요.';
    if (!/^01\d{8,9}$/.test(phoneRaw)) errs.uphone = '휴대전화 번호를 010-1234-5678 형식으로 입력해 주세요.';
    const showErrs = () => {
      form.querySelectorAll('[data-err]').forEach(el => {
        const k = el.dataset.err, input = form.elements[k];
        el.hidden = !errs[k]; el.textContent = errs[k] || '';
        input.setAttribute('aria-invalid', errs[k] ? 'true' : 'false');
      });
      const first = Object.keys(errs)[0];
      if (first) form.elements[first].focus();
      return !!first;
    };
    if (showErrs()) return;
    try {
      const r = await api('POST', '/auth/signup', { uid: id, upw: pw, uname: name, uaddr: addr, uphone: phoneRaw });
      toast(`<b>회원가입이 완료되었습니다.</b><span class="small muted">${esc(name)}님, 환영합니다.</span>`);
      loginAs(r.user);
    } catch (e) {
      Object.assign(errs, (e.data && e.data.fields) || { uid: e.message });
      showErrs();
    }
  }

  // 폼 제출 처리 (페이지 새로고침 막기)
  document.addEventListener('submit', e => {
    if (e.target.id === 'loginForm') { e.preventDefault(); doLogin(e.target); }
    else if (e.target.id === 'signupForm') { e.preventDefault(); doSignup(e.target); }
    else if (e.target.id === 'bookForm') e.preventDefault();
    else if (e.target.id === 'payForm') { e.preventDefault(); doPay(); }
    else if (e.target.id === 'voiceForm') {
      e.preventDefault();
      const text = e.target.elements.vtext.value.trim();
      if (!text) { setVoiceUi(isBookRoute() ? '바꿀 옵션을 입력해 주세요.' : '찾고 싶은 여행을 입력해 주세요.', 'err'); e.target.elements.vtext.focus(); return; }
      if (isBookRoute()) handleBookUtterance([text]); else handleUtterance([text]);
    }
  });

  // 결제 화면: 결제 수단 변경, 카드 번호·유효기간 자동 서식
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.name === 'paymethod') { state.pay.method = el.value; app.innerHTML = viewPay(); const f = document.getElementById('paymethod-' + el.value); if (f) f.focus(); }
    else if (el.id === 'pay-bank') state.pay.bank = el.value;
    else if (el.id === 'card-inst') state.pay.installment = Number(el.value);
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.id === 'card-no') el.value = el.value.replace(/\D/g, '').slice(0, 16).replace(/(\d{4})(?=\d)/g, '$1 ');
    else if (el.id === 'card-exp') { const v = el.value.replace(/\D/g, '').slice(0, 4); el.value = v.length > 2 ? v.slice(0, 2) + '/' + v.slice(2) : v; }
    else if (el.id === 'card-cvc') el.value = el.value.replace(/\D/g, '').slice(0, 3);
  });

  // 예약 화면 옵션 변경 시 초안 갱신
  document.addEventListener('change', e => {
    const el = e.target;
    if (!el.closest('#bookForm') || !state.draft) return;
    const d = state.draft, v = el.value;
    switch (el.name) {
      case 'dest': d.dest = v; break;
      case 'nights': d.nights = Number(v); break;
      case 'date': d.date = v; break;
      case 'style': d.style = v; d.hotel = STYLES[v].hotel; d.meal = STYLES[v].meal; break;
      case 'hotel': d.hotel = Number(v); break;
      case 'meal': d.meal = v; break;
      case 'vehicle': d.vehicle = v; break;
      case 'addon': {
        const set = new Set(d.addons);
        if (el.checked) set.add(v); else set.delete(v);
        d.addons = Array.from(set);
        break;
      }
      default: return;
    }
    normalize(d);
    rerenderBook();
  });

  // 버튼 클릭 처리 (data-action 값으로 구분)
  document.addEventListener('click', async e => {
    if (e.target.matches('[data-overlay]')) { closeModal(); return; }
    const a = e.target.closest('[data-action]');
    if (!a) return;
    const act = a.dataset.action;
    switch (act) {
      case 'scroll': {
        const el = document.getElementById(a.dataset.target);
        if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
        break;
      }
      case 'voice': startVoice(); break;
      case 'say': { const inp = $('#voice-text'); if (inp) inp.value = a.dataset.text; handleUtterance([a.dataset.text]); break; }
      case 'demo-login':
        try { const r = await api('POST', '/auth/login', { uid: 'demo', upw: '1234' }); loginAs(r.user); }
        catch (ex) { toast(esc(ex.message)); }
        break;
      case 'fill-demo': $('#login-id').value = 'demo'; $('#login-pw').value = '1234'; $('#login-submit').focus(); break;
      case 'logout':
        await api('POST', '/auth/logout').catch(() => {});
        state.user = null; state.myBookings = null;
        toast('로그아웃되었습니다.');
        go('home');
        break;
      case 'pax': {
        const d = state.draft; if (!d) break;
        d.pax += Number(a.dataset.d);
        normalize(d);
        rerenderBook();
        break;
      }
      case 'submit-booking':
        if (!state.draft || !state.draft.date) break;
        if (!me()) {
          state.returnTo = 'pay';
          state.notice = '예약을 신청하려면 로그인이 필요합니다. 선택한 내용은 그대로 유지됩니다.';
          go('login');
        } else go('pay');
        break;
      case 'fill-test-card': {
        const n = new Date(), yy = String((n.getFullYear() + 3) % 100).padStart(2, '0');
        $('#card-no').value = '4242 4242 4242 4242'; $('#card-exp').value = '12/' + yy; $('#card-cvc').value = '123';
        break;
      }
      case 'close-modal': closeModal(); break;
      case 'show-history': showHistory(); break;
      case 'show-sms': showSmsBox(); break;
      case 'ask-cancel': {
        const b = (state.myBookings || []).find(x => x.id === a.dataset.id); if (!b) break;
        openModal(`<div class="dialog sm" role="dialog" aria-modal="true" aria-labelledby="cc-title">
          <h2 id="cc-title">예약을 취소할까요?</h2>
          <p>${esc(b.themeName)} · ${esc(b.destName)}<br><span class="small muted num">${fmtPeriod(b.date, b.nights)}</span></p>
          <p class="small muted">취소한 예약은 되돌릴 수 없습니다.</p>
          <div class="dialog-foot">
            <button type="button" class="btn" data-action="close-modal" data-autofocus>닫기</button>
            <button type="button" class="btn btn-danger" data-action="do-cancel" data-id="${esc(b.id)}" id="do-cancel">예약 취소</button>
          </div>
        </div>`);
        break;
      }
      case 'do-cancel': {
        a.disabled = true;
        try {
          const b = (state.myBookings || []).find(x => x.id === a.dataset.id);
          await api('POST', `/bookings/${encodeURIComponent(a.dataset.id)}/cancel`);
          if (b) delete state.deps[depKey(b.theme, b.dest)];
          await loadMyBookings();
          closeModal();
          render();
          toast('예약이 취소되었습니다.');
        } catch (ex) { closeModal(); toast(esc(ex.message)); }
        break;
      }
    }
  });

  // Esc 키로 팝업 닫기
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden) closeModal(); });

  // 첫 화면: 상품 카탈로그와 로그인 상태를 서버에서 불러온 뒤 그리기
  (async function boot() {
    app.innerHTML = '<p class="muted">불러오는 중…</p>';
    try {
      const [cat] = await Promise.all([api('GET', '/catalog'), refreshMe()]);
      applyCatalog(cat);
      state.payMethods = cat.payMethods || {}; state.banks = cat.banks || [];
      state.ready = true;
      render();
      if (me()) showUnreadSms();
    } catch (e) {
      app.innerHTML = `<div class="alert">서버에 연결할 수 없습니다. 프로젝트 폴더에서 <code>npm start</code>로 서버를 실행한 뒤 <code>http://localhost:3000</code>으로 접속해 주세요.<br><span class="small muted">${esc(e.message)}</span></div>`;
    }
  })();
})();
</script>
