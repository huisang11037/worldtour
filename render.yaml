# Render 배포 설정 (Blueprint)
# Render 대시보드 → New → Blueprint → 이 저장소 선택 → Apply
services:
  - type: web
    name: mrworld-theme-tour
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/catalog
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: TZ
        value: Asia/Seoul
